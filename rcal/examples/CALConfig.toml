[system]
id = "BasicExample"
default_transport = "main-bus"

[system.logging]
default_level = "info"

[[system.logging.sink]]
type = "stdout"
format = "pretty"
level = "info"

[[transport]]
id = "main-bus"
type = "dds"
uri = "0"
externalizer = "pretty_xml"

[externalizer.pretty_xml]
type = "xml"
pretty = true

[[service]]
id = "basic-example"
