workspace = { members = [ "rcal_macros" ] }

[package]
name = "rcal"
version = "0.1.0"
edition = "2024"

[dependencies]
lazy_static = "1.5.0"
mac_address = { version = "1.1.8", features = ["serde"] }
rcal_macros = { path = "./rcal_macros" }
serde = { version = "1.0.229", features = ["derive"] }
slog = "2.8.2"
slog-async = "2.8.0"
slog-term = "2.9.2"
toml = "1.1.4"
uuid = { version = "1.24.0", features = ["v1", "v3", "v4", "slog", "serde", "rng"] }
omq-tokio = "0.21.1"
tokio = { version = "1.53.1", features = ["full"] }
bytes = "1.12.1"
quick-xml = { version = "0.37", features = ["serialize"] }

[[test]]
name = "zmq_radio_dish"
harness = true
