[package]
name = "adsb_sim"
version = "0.1.0"
edition = "2021"
description = "OMS CAL service that simulates entities from ADS-B Exchange data"

[[bin]]
name = "adsb_sim"
path = "src/bin/adsb_sim.rs"

[dependencies]
rcal = { path = "../rcal" }
rcal_macros = { path = "../rcal/rcal_macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
slog = "2"
